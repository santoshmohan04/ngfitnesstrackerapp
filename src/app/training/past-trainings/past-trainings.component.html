<div fxLayout="row wrap" fxLayoutAlign="center center" fxLayoutGap="16px" class="filterInput">
  <mat-form-field fxFlex="20%">
    <mat-label>From Date</mat-label>
    <input matInput [matDatepicker]="fromPicker" [value]="fromDate"
      aria-label="Filter exercises from date"
      (dateChange)="fromDate = $event.value; applyDateFilter()" />
    <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>
    <mat-datepicker #fromPicker></mat-datepicker>
  </mat-form-field>

  <mat-form-field fxFlex="20%">
    <mat-label>To Date</mat-label>
    <input matInput [matDatepicker]="toPicker" [value]="toDate"
      aria-label="Filter exercises to date"
      (dateChange)="toDate = $event.value; applyDateFilter()" />
    <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>
    <mat-datepicker #toPicker></mat-datepicker>
  </mat-form-field>

  <mat-form-field fxFlex="40%">
    <input matInput type="text" placeholder="Filter" (keyup)="doFilter($event)" />
  </mat-form-field>
</div>

@if (dataSource.data.length === 0 && !isLoading) {
  <div class="empty-state">
    <mat-icon class="empty-icon">fitness_center</mat-icon>
    <p>No workout history yet</p>
  </div>
}

<div class="container">
  <mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="date">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Date</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.date | date }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.name }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="calories">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Calories</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.calories | number }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="duration">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Duration</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.duration | number }} seconds</mat-cell>
    </ng-container>

    <ng-container matColumnDef="state">
      <mat-header-cell *matHeaderCellDef mat-sort-header>State</mat-header-cell>
      <mat-cell *matCellDef="let element">
        <span class="state-pill"
          [class.state-completed]="element.state === 'completed'"
          [class.state-cancelled]="element.state === 'cancelled'">
          {{ element.state }}
        </span>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="onEdit(element)" title="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(element)" title="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
